name: Generate GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:17 UTC (03:17 in Costa Rica, UTC-6).
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate H1rono-style full-year contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: marcor0311
          template: classic
          base: header
          config_timezone: America/Costa_Rica
          config_display: large
          config_order: base.header, isocalendar
          config_presets: metrics-presets/preset-1.yml
          extras_js: |
            document.querySelectorAll(".items-wrapper > section:first-child .field")
              .forEach(element => {
                if (/^Followed by\s+\d+\s+users?$/.test(element.textContent.trim())) {
                  element.remove();
                }
              })
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: assets/metrics-1.svg
          verify: yes

      - name: Commit updated metrics when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-1.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub metrics"
            git push
          else
            echo "Metrics are unchanged; no commit created."
          fi
