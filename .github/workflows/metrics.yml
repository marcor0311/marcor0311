name: Generate GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:17 UTC (03:17 in Costa Rica, UTC-6).
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate H1rono-style full-year contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: marcor0311
          template: classic
          base: header
          config_timezone: America/Costa_Rica
          config_display: large
          config_order: base.header, isocalendar
          config_presets: https://raw.githubusercontent.com/marcor0311/marcor0311/main/metrics-presets/preset-1.yml
          extras_js: |
            document.querySelectorAll(".items-wrapper > section:first-child .field")
              .forEach(element => {
                if (/^Followed by\s+\d+\s+users?$/.test(element.textContent.trim())) {
                  element.remove();
                }
              })
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics-1.svg
          output_action: none
          verify: yes

      - name: Compose annotations with animated night-green grid
        run: |
          mkdir -p tmp
          python3 scripts/compose_metrics_svg.py \
            /metrics_renders/metrics-1.svg \
            profile-3d-contrib/profile-night-green.svg \
            tmp/metrics-1-composed.svg

      - name: Collect generated SVG
        run: |
          mv tmp/metrics-1-composed.svg assets/metrics-1.svg

      - name: Commit generated SVG
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add assets/metrics-1.svg
          if ! git diff --staged --quiet -- assets/metrics-1.svg; then
            git commit -m "Update metrics-1.svg [skip ci]"
            git push
          else
            echo "metrics-1.svg is unchanged; no commit created."
          fi
