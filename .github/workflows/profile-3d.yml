name: Generate 3D GitHub Contributions

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:17 UTC (03:17 in Costa Rica, UTC-6).
    - cron: "17 9 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-3d-contributions
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution graphics
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: marcor0311

      - name: Check out upstream 3D renderer source
        uses: actions/checkout@v5
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: e235d118909be71eb7edb05482a3de4e76156df3
          path: .upstream/github-profile-3d-contrib

      - name: Install upstream renderer dependencies
        run: npm ci
        working-directory: .upstream/github-profile-3d-contrib

      - name: Fit upstream renderer to the selected date range
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path("src/create-3d-contrib.ts")
          source = renderer.read_text()
          expected = "const dx = width / 64;"
          replacement = "const dx = width / (weekcount + 11);"
          if source.count(expected) != 1:
              raise SystemExit("The pinned upstream renderer changed; review the scale patch.")
          renderer.write_text(source.replace(expected, replacement, 1))
          PY
          cp "$GITHUB_WORKSPACE/scripts/generate-night-green-range.ts" src/generate-night-green-range.ts
        working-directory: .upstream/github-profile-3d-contrib

      - name: Generate night-green calendar for the last six months
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: marcor0311
          OUTPUT_PATH: ${{ github.workspace }}/profile-3d-contrib/profile-night-green-six-months.svg
        run: ./node_modules/.bin/ts-node src/generate-night-green-range.ts
        working-directory: .upstream/github-profile-3d-contrib

      - name: Create or update graphics pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 3D contribution graph"
            # Repository rules require changes to reach main through a PR.
            # This dedicated generated branch is recreated from the current main.
            git push --force origin HEAD:profile-3d-contrib
            pr_state="$(gh pr view profile-3d-contrib --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)"
            if [ "$pr_state" = "CLOSED" ]; then
              if ! gh pr reopen profile-3d-contrib --repo "$GITHUB_REPOSITORY"; then
                echo "::warning::Generated files were pushed, but GitHub Actions could not reopen their pull request."
                echo "Open the generated branch from the Actions run to review the graphics." >> "$GITHUB_STEP_SUMMARY"
              fi
            elif [ "$pr_state" != "OPEN" ]; then
              if ! gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --head profile-3d-contrib \
                --base main \
                --title "Refresh 3D GitHub contribution graphics" \
                --body "Automated refresh of the green animated contribution SVGs generated from the real GitHub contribution data for @marcor0311."; then
                echo "::warning::Generated files were pushed, but GitHub Actions is not permitted to create pull requests in this repository."
                echo "Allow GitHub Actions to create pull requests in repository Settings > Actions > General, then rerun this workflow. The generated branch is profile-3d-contrib." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
