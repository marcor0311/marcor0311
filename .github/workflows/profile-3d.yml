name: Generate 3D GitHub Contributions

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:17 UTC (03:17 in Costa Rica, UTC-6).
    - cron: "17 9 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-3d-contributions
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution graphics
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: marcor0311

      - name: Generate recent 90-day 3D contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: marcor0311
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from html import escape
          from urllib.request import Request, urlopen

          token = os.environ["GH_TOKEN"]
          username = os.environ["USERNAME"]
          today = dt.date.today()
          since = today - dt.timedelta(days=89)
          query = """query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount } }
                }
              }
            }
          }"""
          payload = json.dumps({"query": query, "variables": {
              "login": username,
              "from": dt.datetime.combine(since, dt.time.min, dt.timezone.utc).isoformat(),
              "to": dt.datetime.combine(today, dt.time.max, dt.timezone.utc).isoformat(),
          }}).encode()
          request = Request("https://api.github.com/graphql", data=payload, headers={
              "Authorization": f"bearer {token}",
              "Content-Type": "application/json",
          })
          with urlopen(request) as response:
              result = json.load(response)
          if result.get("errors"):
              raise RuntimeError(result["errors"])
          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = [day for week in calendar["weeks"] for day in week["contributionDays"]]
          days = [day for day in days if since.isoformat() <= day["date"] <= today.isoformat()]
          max_count = max((day["contributionCount"] for day in days), default=0)
          width, height = 900, 600
          top_colors = ["#444444", "#1b7d28", "#24a736", "#2dd143", "#57da69"]
          left_colors = ["#393939", "#176921", "#1e8c2d", "#26af38", "#49b658"]
          right_colors = ["#303030", "#13581c", "#197526", "#1f922f", "#3d994a"]
          cubes = []
          month_positions = {}
          first_day = dt.date.fromisoformat(days[0]["date"])
          first_week = first_day - dt.timedelta(days=first_day.weekday())
          for day in days:
              date = dt.date.fromisoformat(day["date"])
              count = day["contributionCount"]
              level = 0 if count == 0 else min(4, 1 + (count - 1) * 4 // max(1, max_count))
              week = (date - first_week).days // 7
              x = 125 + week * 45 - date.weekday() * 15
              y = 95 + week * 26 + date.weekday() * 11
              title = f"{count} contributions on {date.isoformat()}"
              cubes.append(f'''<g class="cube" style="animation-delay:{week * 25}ms">
                <path d="M{x},{y+10} L{x},{y+17} L{x-18},{y+27} L{x-18},{y+20} Z" fill="{left_colors[level]}"/>
                <path d="M{x},{y+17} L{x+18},{y+27} L{x+18},{y+34} L{x},{y+24} Z" fill="{right_colors[level]}"/>
                <path d="M{x},{y} L{x+18},{y+10} L{x},{y+20} L{x-18},{y+10} Z" fill="{top_colors[level]}"><title>{escape(title)}</title></path>
              </g>''')
              if date.day <= 7:
                  month_positions[date.strftime("%Y-%m")] = (x, date.strftime("%b"))
          labels = [f'<text x="{x-15}" y="78" class="muted">{escape(month)}</text>' for x, month in month_positions.values()]
          total = calendar["totalContributions"]
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}" role="img" aria-labelledby="title desc">
          <title id="title">GitHub contributions over the last 90 days</title><desc id="desc">{total} contributions from {since.isoformat()} through {today.isoformat()}.</desc>
          <style>text{{font-family:Ubuntu,Helvetica,Arial,sans-serif;font-size:15px;fill:#eeeeff}}.muted{{fill:#aaaaaa}}.cube{{opacity:0;animation:appear .45s ease-out forwards}}@keyframes appear{{to{{opacity:1}}}}</style>
          <rect width="100%" height="100%" rx="10" fill="#00000f"/><text x="42" y="38" font-size="24" font-weight="700">{total} contributions · last 90 days</text>
          {''.join(labels)}{''.join(cubes)}
          <text x="42" y="570" class="muted">{since.strftime('%b %d')} – {today.strftime('%b %d, %Y')}</text></svg>'''
          os.makedirs("profile-3d-contrib", exist_ok=True)
          with open("profile-3d-contrib/profile-green-90-days.svg", "w", encoding="utf-8") as file:
              file.write(svg)
          PY

      - name: Create or update graphics pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 3D contribution graph"
            # Repository rules require changes to reach main through a PR.
            # This dedicated generated branch is recreated from the current main.
            git push --force origin HEAD:profile-3d-contrib
            pr_state="$(gh pr view profile-3d-contrib --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)"
            if [ "$pr_state" = "CLOSED" ]; then
              if ! gh pr reopen profile-3d-contrib --repo "$GITHUB_REPOSITORY"; then
                echo "::warning::Generated files were pushed, but GitHub Actions could not reopen their pull request."
                echo "Open the generated branch from the Actions run to review the graphics." >> "$GITHUB_STEP_SUMMARY"
              fi
            elif [ "$pr_state" != "OPEN" ]; then
              if ! gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --head profile-3d-contrib \
                --base main \
                --title "Refresh 3D GitHub contribution graphics" \
                --body "Automated refresh of the green animated contribution SVGs generated from the real GitHub contribution data for @marcor0311."; then
                echo "::warning::Generated files were pushed, but GitHub Actions is not permitted to create pull requests in this repository."
                echo "Allow GitHub Actions to create pull requests in repository Settings > Actions > General, then rerun this workflow. The generated branch is profile-3d-contrib." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
