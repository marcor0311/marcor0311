name: Generate 3D GitHub Contributions

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:17 UTC (03:17 in Costa Rica, UTC-6).
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: profile-3d-contributions
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution graphics
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: marcor0311

      - name: Commit generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 3D contribution graph"
            git push
          fi
