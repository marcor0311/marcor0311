<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-size="14">
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; dominant-baseline: middle; }
    
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    
  </style>
  <!-- Window background -->
  <rect width="100%" height="100%" fill="#1e1e1e" rx="14" ry="14"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="30" fill="#2c2c2c" rx="14" ry="14"/>
  <rect x="0" y="16" width="800" height="14" fill="#2c2c2c"/>
  <g opacity="0.55">
    <circle cx="22" cy="15" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="15" r="5.5" fill="#febc2e"/>
    <circle cx="58" cy="15" r="5.5" fill="#28c840"/>
  </g>
  <text x="400" y="16" fill="#6a737d" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">profile.json</text>

  <!-- Tab bar -->
  <rect x="0" y="30" width="800" height="32" fill="#2c2c2c"/>
  <rect x="0" y="30" width="156" height="32" fill="#252525"/>
  <!-- Active tab pill -->
  <rect x="156" y="30" width="160" height="32" fill="#1e1e1e"/>
  <rect x="156" y="30" width="160" height="2" fill="#569cd6"/>
  <text x="172" y="46" fill="#d4d4d4" font-family="ui-monospace, monospace" font-size="11" dominant-baseline="middle">profile.json</text>
  <text x="300" y="46" fill="#6a737d" font-family="ui-monospace, monospace" font-size="11" dominant-baseline="middle">×</text>

  <!-- Sidebar -->
  <rect x="0" y="62" width="156" height="238" fill="#252525"/>
  <text x="20" y="74" fill="#6a737d" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.2" dominant-baseline="middle">EXPLORER</text>
  <rect x="0" y="86" width="156" height="22" fill="#d4d4d4" fill-opacity="0.06"/><text x="20" y="100" fill="#d4d4d4" font-size="12" dominant-baseline="middle">header.svg</text>
  <text x="20" y="122" fill="#6a737d" font-size="12" dominant-baseline="middle">about.svg</text>
  <text x="20" y="144" fill="#6a737d" font-size="12" dominant-baseline="middle">skills.svg</text>
  <text x="20" y="166" fill="#6a737d" font-size="12" dominant-baseline="middle">gh-stats.svg</text>
  <text x="20" y="188" fill="#6a737d" font-size="12" dominant-baseline="middle">footer.svg</text>
  <!-- Vertical divider between sidebar and editor -->
  <line x1="156" y1="62" x2="156" y2="300" stroke="#353535" stroke-width="1"/>

  <!-- Editor body -->
  <g class="cl0">
    <text x="184" y="86" fill="#6a737d" text-anchor="end" font-size="12">1</text>
    <g transform="translate(194 86)"><text x="0" fill="#d4d4d4">{</text></g>
  </g>
  <g class="cl1">
    <text x="184" y="108" fill="#6a737d" text-anchor="end" font-size="12">2</text>
    <g transform="translate(194 108)"><text x="0" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#569cd6">&quot;name&quot;</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#ce9178">&quot;Marco Rodríguez&quot;</tspan><tspan fill="#d4d4d4">,</tspan></text></g>
  </g>
  <g class="cl2">
    <text x="184" y="130" fill="#6a737d" text-anchor="end" font-size="12">3</text>
    <g transform="translate(194 130)"><text x="0" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#569cd6">&quot;role&quot;</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#ce9178">&quot;Analista Programador II&quot;</tspan><tspan fill="#d4d4d4">,</tspan></text></g>
  </g>
  <g class="cl3">
    <text x="184" y="152" fill="#6a737d" text-anchor="end" font-size="12">4</text>
    <g transform="translate(194 152)"><text x="0" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#569cd6">&quot;org&quot;</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#ce9178">&quot;BAC&quot;</tspan><tspan fill="#d4d4d4">,</tspan></text></g>
  </g>
  <g class="cl4">
    <text x="184" y="174" fill="#6a737d" text-anchor="end" font-size="12">5</text>
    <g transform="translate(194 174)"><text x="0" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#569cd6">&quot;location&quot;</tspan><tspan fill="#d4d4d4">: </tspan><tspan fill="#ce9178">&quot;Costa Rica&quot;</tspan><tspan dx="-0.15em" fill="#d4d4d4" font-weight="700" style="animation: blink 1s steps(1) infinite">|</tspan></text></g>
  </g>
  <g class="cl5">
    <text x="184" y="196" fill="#6a737d" text-anchor="end" font-size="12">6</text>
    <g transform="translate(194 196)"><text x="0" fill="#d4d4d4">}</text></g>
  </g>

</svg>